.price span{color:var(--mut);font-weight:700}
.per{color:var(--mut);font-size:14px;min-height:22px;margin-top:4px}

details{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px}

details p{margin:8px 0 0;color:var(--mut)}

var L='ar',app='m',co='1';
try{L=localStorage.getItem('sa3rati_lang')||''}catch(e){}
if(!T[L]){var n=(navigator.language||'ar').slice(0,2);L=T[n]?n:'ar'}
var fmt=function(x){return x.toLocaleString('sv-SE').replace(/ /g,' ')};
function feats(id,arr){document.getElementById(id).innerHTML=arr.map(function(f){return '<li class="'+(f[1]?'':'no')+'"><i>'+(f[1]?'✓':'–')+'</i><span>'+f[0]+'</span></li>'}).join('')}
function draw(){
  var t=T[L];document.documentElement.lang=L;document.documentElement.dir=L==='ar'?'rtl':'ltr';
  document.title='Musclivo – '+({ar:'الأسعار',en:'Pricing',sv:'Priser',ru:'Цены'})[L];
  document.querySelectorAll('[data-t]').forEach(function(e){var k=e.dataset.t;if(t[k]!=null)e.innerHTML=t[k]});
  document.querySelectorAll('#lg [data-lg]').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.lg===L)});
  document.querySelectorAll('[data-app]').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.app===app)});
  document.querySelectorAll('[data-co]').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.co===co)});
  var y=app==='y';
  document.getElementById('appP').textContent=fmt(y?P.appY:P.appM);
  document.getElementById('appU').textContent='kr';
  var sv=Math.round((1-P.appY/(P.appM*12))*100);
  document.getElementById('appPer').innerHTML=y?(t.perYear+' · '+t.equals+' '+fmt(Math.round(P.appY/12))+' kr '+t.perMonth+'<span class="save">'+t.save+' '+sv+'%</span>'):t.perMonth;
  var cp=P['co'+co],mo=+co;
  document.getElementById('coP').textContent=fmt(cp);
  var csv=Math.round((1-cp/(P.co1*mo))*100);
  document.getElementById('coPer').innerHTML=mo===1?t.perMonth:(t.equals+' '+fmt(Math.round(cp/mo))+' kr '+t.perMonth+'<span class="save">'+t.save+' '+csv+'%</span>');
  document.getElementById('lifeP').textContent=fmt(P.life);
  feats('appF',t.appF);feats('coF',t.coF);feats('lifeF',t.lifeF);
  document.getElementById('faq').innerHTML=t.faq.map(function(q){return '<details><summary>'+q[0]+'</summary><p>'+q[1]+'</p></details>'}).join('');
}
document.querySelectorAll('#lg [data-lg]').forEach(function(b){b.onclick=function(){L=b.dataset.lg;try{localStorage.setItem('sa3rati_lang',L)}catch(e){}draw()}});
document.querySelectorAll('[data-app]').forEach(function(b){b.onclick=function(){app=b.dataset.app;draw()}});
document.querySelectorAll('[data-co]').forEach(function(b){b.onclick=function(){co=b.dataset.co;draw()}});
document.getElementById('thb').onclick=function(){var r=document.documentElement,l=r.dataset.theme==='light';if(l)delete r.dataset.theme;else r.dataset.theme='light';try{localStorage.setItem('musclivo_theme',l?'dark':'light')}catch(e){}};
draw();
</script>
